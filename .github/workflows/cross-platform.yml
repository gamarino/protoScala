name: Cross-platform

# macOS and Windows. Linux is ci.yml's (sibling build trees, protoST interop,
# the static conformance ratchet); this workflow adds the two platforms nobody
# here can run locally.
#
# protoCore is built and INSTALLED here, and protoScala consumes the installed
# package (-DPROTOCORE_REQUIRE_PACKAGE=ON): that is the supported mode on
# Windows, and it also exercises the package path, which ci.yml does not.
# protoIO is the sibling source tree, compiled into protoScala's build.
#
# Refs are pinned like ci.yml's. protoCore 2.10.2 (tag v2.10.2, b7f6d82), as
# ci.yml's main job. The Windows minimum, 2.9.0 (where protoCore honours
# ProtoSpace::setThreadStackBytes and names its DLL protoCore-3.dll), has no
# job; the repository's only floor job is ci.yml's (Linux, 2.7.0). protoIO
# 0.2.2 (main, 1611ff9): the floor everywhere. Bump deliberately.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOCORE_REPO: numaes/protoCore
  PROTOCORE_REF: b7f6d82a3960cb74e070e053aa644ec2f79c7fc2
  PROTOIO_REPO: gamarino/protoIO
  PROTOIO_REF: 1611ff9cf8d499cdc42a6e108e42ecfc36fd8164
  # Clock-dependent, as in ci.yml: their verdict is a timeout.
  CLOCK_DEPENDENT_TESTS: '^embedder-conformance/isolate\.'

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple clang, arm64)
            os: macos-14
            # No test is excluded on macOS beyond the clock-dependent ones.
            exclude_tests: ''
          - name: Windows (MSVC, x64)
            os: windows-2022
            # Nothing is excluded on Windows either: the transpiler builds its
            # modules with nmake, cl and link from the MSVC environment below, and
            # the script tests no longer depend on MSYS path rewriting or FIFOs.
            exclude_tests: ''
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out protoScala
        uses: actions/checkout@v4
        with:
          path: protoScala

      - name: Check out protoCore as a sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOCORE_REPO }}
          ref: ${{ env.PROTOCORE_REF }}
          path: protoCore

      - name: Check out protoIO as a sibling
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROTOIO_REPO }}
          ref: ${{ env.PROTOIO_REF }}
          path: protoIO

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in readline openssl@3 ninja coreutils; do brew list "$f" >/dev/null 2>&1 || brew install "$f"; done
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "EXTRA_PREFIX=;$(brew --prefix readline)" >> "$GITHUB_ENV"
          # The test scripts use GNU timeout, which macOS does not ship.
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          for d in "C:/Program Files/OpenSSL" "C:/Program Files/OpenSSL-Win64"; do
            if [ -f "$d/include/openssl/ssl.h" ]; then echo "OPENSSL_ROOT_DIR=$d" >> "$GITHUB_ENV"; break; fi
          done

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build and install protoCore
        # A full build: the conformance archive is part of the package, and
        # protoScala's embedder-conformance tests are registered only with it.
        run: |
          cmake -S protoCore -B protoCore/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build protoCore/build --parallel 4
          cmake --install protoCore/build --prefix "$GITHUB_WORKSPACE/prefix"

      - name: Configure protoScala
        working-directory: protoScala
        # On Windows protoScala's own targets build with /WX: a new MSVC warning
        # fails the build here rather than accumulating.
        run: >
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPROTOCORE_REQUIRE_PACKAGE=ON
          "-DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/prefix$EXTRA_PREFIX"
          ${OPENSSL_ROOT_DIR:+"-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR"}
          ${{ runner.os == 'Windows' && '-DPROTOSCALA_MSVC_WARNINGS_AS_ERRORS=ON' || '' }}

      - name: Confirm the embedder conformance suite was registered
        working-directory: protoScala
        run: |
          grep -q 'protoCore::protoCoreConformance' build/CMakeCache.txt build/tests/unit/CTestTestfile.cmake 2>/dev/null \
            || ctest --test-dir build -N | grep -q 'embedder-conformance/' \
            || { echo "protoCore's conformance archive was not found: the embedder suite would be missing"; exit 1; }

      - name: Build protoScala
        working-directory: protoScala
        run: cmake --build build --parallel 4

      - name: Report the registered test count
        working-directory: protoScala
        run: |
          COUNT=$(ctest --test-dir build -N | tail -1)
          echo "$COUNT"
          echo "protoScala ctest (${{ runner.os }}): $COUNT" >> "$GITHUB_STEP_SUMMARY"

      - name: Test suite
        working-directory: protoScala
        run: ctest --test-dir build -j2 --output-on-failure --timeout 600 -E "${CLOCK_DEPENDENT_TESTS}${{ matrix.exclude_tests }}" < /dev/null

      - name: Install and run
        working-directory: protoScala
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/prefix"
          PATH="$GITHUB_WORKSPACE/prefix/bin:$PATH" protoscala --version
          printf 'println("hello from " + sys.props("os.name"))\n' > hello.scala
          PATH="$GITHUB_WORKSPACE/prefix/bin:$PATH" protoscala hello.scala

      - name: The ZIP runs on its own (Windows)
        # The package must carry everything protoscala.exe loads: protoCore's DLL,
        # OpenSSL's, and the C++ runtime. It is unpacked into a clean directory
        # and run with a PATH that holds only that directory and Windows' own, so
        # a DLL found in a build or install tree cannot hide a missing one.
        if: runner.os == 'Windows'
        working-directory: protoScala/build
        run: |
          # CMake's cpack, by its path: Chocolatey's cpack.exe is also on PATH.
          "$(dirname "$(command -v cmake)")/cpack" -G ZIP
          zip=$(ls protoscala-*.zip | head -1)
          unzip -l "$zip" | tee zip-contents.txt
          for f in protoscala.exe protoscalac.exe protoScala.dll protoCore-3.dll \
                   libcrypto-3-x64.dll libssl-3-x64.dll msvcp140.dll vcruntime140.dll \
                   protoCore.h protoCore.lib protoScala.lib GeneratedModule.h; do
            grep -q "/$f\$" zip-contents.txt || { echo "the ZIP lacks $f"; exit 1; }
          done
          grep -qi 'OpenSSL-.*-LICENSE.txt' zip-contents.txt || { echo "the ZIP lacks OpenSSL's licence"; exit 1; }
          clean="$RUNNER_TEMP/zip-run"
          rm -rf "$clean" && mkdir -p "$clean" && unzip -q "$zip" -d "$clean"
          bin=$(dirname "$(find "$clean" -name protoscala.exe | head -1)")
          cd "$clean"
          printf 'println("hello from the ZIP on " + sys.props("os.name"))\n' > hello.scala
          out=$(PATH="$bin:/c/Windows/System32:/c/Windows" protoscala.exe hello.scala)
          echo "$out"
          [ "$out" = "hello from the ZIP on Windows" ] || { echo "unexpected output"; exit 1; }
          # The unpacked protoscalac builds a module against the headers and import
          # libraries in the ZIP, and the unpacked protoscala runs it.
          printf '@main def run(): Unit = println("module from the ZIP")\n' > mod.scala
          "$bin/protoscalac.exe" mod.scala -o mod --build-so
          out=$(PATH="$bin:/c/Windows/System32:/c/Windows" protoscala.exe --run-module mod/module.dll)
          echo "$out"
          [ "$out" = "module from the ZIP" ] || { echo "unexpected output"; exit 1; }
